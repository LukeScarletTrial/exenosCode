name: iOS Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      PROJECT_PATH: ExenosCode.xcodeproj
      SCHEME: ExenosCode
      CONFIGURATION: Release
      DESTINATION: generic/platform=iOS
      ARCHIVE_PATH: build/ExenosCode.xcarchive
      EXPORT_PATH: build/export
      EXPORT_OPTIONS_PLIST: scripts/ci/ExportOptions.plist
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT_PATH" -scheme "$SCHEME"

      - name: Build
        run: |
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination "$DESTINATION" \
            clean build

      - name: Archive
        run: |
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination "$DESTINATION" \
            -archivePath "$ARCHIVE_PATH" \
            archive

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST" \
            -exportPath "$EXPORT_PATH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exenos-ios-build
          path: |
            build/ExenosCode.xcarchive
            build/export
