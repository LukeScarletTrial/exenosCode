name: iOS Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      PROJECT_PATH: ExenosCode.xcodeproj
      SCHEME: ExenosCode
      CONFIGURATION: Release
      DESTINATION: generic/platform=iOS
      ARCHIVE_PATH: build/ExenosCode.xcarchive
      EXPORT_PATH: build/export
      EXPORT_OPTIONS_PLIST: scripts/ci/ExportOptions.plist
      XCODE_UNSIGNED_FLAGS: CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT_PATH" -scheme "$SCHEME" $XCODE_UNSIGNED_FLAGS

      - name: Build
        run: |
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination "$DESTINATION" \
            clean build \
            $XCODE_UNSIGNED_FLAGS

      - name: Archive
        if: ${{ secrets.APPLE_TEAM_ID != '' && secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.P12_PASSWORD != '' && secrets.PROVISIONING_PROFILE_BASE64 != '' }}
        run: |
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination "$DESTINATION" \
            -archivePath "$ARCHIVE_PATH" \
            archive

      - name: Export IPA
        if: ${{ secrets.APPLE_TEAM_ID != '' && secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.P12_PASSWORD != '' && secrets.PROVISIONING_PROFILE_BASE64 != '' }}
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST" \
            -exportPath "$EXPORT_PATH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: exenos-ios-build
          path: |
            build
            build/export
